<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Preview | Shashwat Cars</title><link rel="stylesheet" href="/styles.css"></head><body class="admin"><div class="preview">ADMIN CUSTOMER PREVIEW · DATA IS SAVED ONLY IN THIS BROWSER</div><header class="nav"><div class="wrap"><a class="brand" href="/"><span class="mark">S</span><span>SHASHWAT CARS<small>ADMIN PREVIEW</small></span></a><nav class="links"><a href="/">Home</a><a href="/cars.html">Inventory</a></nav><button class="btn gold" onclick="resetDemo()">Reset Demo Data</button></div></header><section class="section"><div class="wrap"><div class="admin-panel"><h2>Add New Car</h2><p class="note">Upload a transparent PNG/WebP for the clean cutout look. If you mark Featured, the car appears on Home automatically.</p><form id="carForm" class="form-grid"><label>Brand<input name="brand" required placeholder="Hyundai"></label><label>Model<input name="model" required placeholder="Creta"></label><label>Variant<input name="variant" required placeholder="SX(O)"></label><label>Year<input name="year" type="number" required value="2022"></label><label>Price ₹<input name="price" type="number" required placeholder="1285000"></label><label>KM Driven<input name="km" type="number" required placeholder="42000"></label><label>Fuel<select name="fuel"><option>Petrol</option><option>Diesel</option><option>CNG</option><option>Electric</option></select></label><label>Transmission<select name="transmission"><option>Manual</option><option>Automatic</option></select></label><label>Body Type<select name="type"><option>Sedan</option><option>Hatchback</option><option>SUV</option></select></label><label>Location<input name="location" value="Bhopal"></label><label class="wide">PNG/JPG/WebP Image Upload<input name="imageFile" type="file" accept="image/png,image/webp,image/jpeg"></label><label class="wide">Or Image URL<input name="imageUrl" placeholder="https://.../car.png"></label><label class="wide check"><input name="featured" type="checkbox"> Featured on Home</label><button class="btn gold" type="submit">Add Vehicle →</button></form><p id="msg" class="note"></p></div><div class="admin-panel"><h2>Inventory Management</h2><div style="overflow:auto"><table class="table"><thead><tr><th>Vehicle</th><th>Type</th><th>Price</th><th>Status</th><th>Actions</th></tr></thead><tbody id="adminRows"></tbody></table></div></div></div></section><script src="/app.js"></script></body></html>
